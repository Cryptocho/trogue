[package]
name = "wanderstead"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[features]
# Normal local `cargo run` links the engine once; distribution builds opt out.
default = ["dev-dylib"]
dev-dylib = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_asset", "bevy_gltf",
    "bevy_window", "bevy_winit", "wayland", "bevy_render", "bevy_core_pipeline",
    "bevy_sprite", "bevy_pbr", "experimental_pbr_pcss", "bevy_scene", "png", "dds",
] }
raw-window-handle = "0.6"
wgpu-types = "24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"
