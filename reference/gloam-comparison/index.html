<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青灯河湾 · 像素实景与参考</title>
<style>
:root { color-scheme: dark; background: #141819; color: #eee8dc; font: 16px/1.55 system-ui,sans-serif; }
body { max-width: 1800px; margin: auto; padding: .9rem; }
header, nav { display:flex; align-items:center; flex-wrap:wrap; gap: .5rem 1.2rem; }
header { justify-content:space-between; } h1 { font-size:1.35rem; margin:0; } select { font:inherit; }
main { display:grid; gap:.75rem; grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:.85rem; }
main.solo { grid-template-columns:1fr; } figure { margin:0; } img { width:100%; height:auto; display:block; aspect-ratio:16 / 9; }
img {object-fit:contain} img[src^="2d"], img[src^="riverside/"] { image-rendering:pixelated; }
figcaption { margin-bottom:.25rem; color:#e4c597; font-weight:600; } p { color:#c0c4c3; margin:.7rem 0; }
a { color:#b7d5e4; } @media(max-width:760px){ main { grid-template-columns:1fr; } }
</style>
<header>
  <h1>青灯河湾 · 实景对照</h1>
  <nav aria-label="比较方式">
    <label>取景 <select id="pair"><option>河湾实机 / 选定的参考</option><option>河湾 / HD-2D 夜林</option><option>倒影开 / 关</option><option>河湾界石：左灯 / 右灯</option><option>河湾近景 / 全景</option><option>历史：旧夜林的两种画法</option></select></label>
    <label>显示 <select id="layout"><option>并排</option><option>只看图 A</option><option>只看图 B</option></select></label>
  </nav>
</header>
<main>
  <figure><figcaption>A · 青灯河湾 · 实机</figcaption><a href="riverside/wide.png"><img src="riverside/wide.png" alt="青灯河湾原生主窗口截图"></a></figure>
  <figure><figcaption>B · 风格参考 · 非实机</figcaption><a href="art-direction/riverside-study-02.webp"><img src="art-direction/riverside-study-02.webp" alt="选作画风依据的生成参考图"></a></figure>
</main>
<p>运行 <code>tools/gloam/view.sh --2d</code> 进入河湾。空格切到原 HD-2D 夜林；R 只开关水中倒影。两幅场景布局不同，不是同一个地形。点图可打开原图。</p>
<p><a href="riverside/study.md">河湾素材来源与实机验证</a> · <a href="art-direction/user-riverside.png">用户给的风格图</a> · <a href="study.md">历史夜林对照</a></p>
<script>
const pairs = [
    [['青灯河湾 · 实机', 'riverside/wide.png'], ['选定的风格参考 · 非实机', 'art-direction/riverside-study-02.webp']],
    [['青灯河湾 · 纯 2D', 'riverside/wide.png'], ['苔径留灯 · HD-2D', 'hd2d.png']],
    [['精灵倒影开启', 'riverside/wide.png'], ['关闭倒影，水光保留', 'riverside/no-mirrors.png']],
    [['苔石 · 左灯', 'riverside/left.png'], ['苔石 · 右灯', 'riverside/right.png']],
    [['河湾 · 近景', 'riverside/detail.png'], ['河湾 · 全景', 'riverside/wide.png']],
    [['旧夜林 · 像素', '2d.png'], ['旧夜林 · HD-2D', 'hd2d.png']],
];
const pair = document.querySelector('#pair'), layout = document.querySelector('#layout');
function update() {
    document.querySelector('main').classList.toggle('solo', layout.selectedIndex !== 0);
    document.querySelectorAll('figure').forEach((figure, i) => {
        const [label, file] = pairs[pair.selectedIndex][i];
        figure.hidden = layout.selectedIndex !== 0 && layout.selectedIndex !== i + 1;
        figure.querySelector('figcaption').textContent = `${i === 0 ? 'A' : 'B'} · ${label}`;
        const link = figure.querySelector('a'), image = figure.querySelector('img');
        if (image.getAttribute('src') !== file) { link.href = file; image.src = file; }
        image.alt = label;
    });
}
pair.addEventListener('change', update); layout.addEventListener('change', update);
</script>
</html>
